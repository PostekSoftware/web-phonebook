<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonebook Login - {{ page.name }}</title>
    <link rel="icon" href="/static/icon.png">
    <link rel="stylesheet" href="/static/web-phonebook.css">
    <script src="/static/common.js" defer></script>
</head>

<body>

    <div class="main">
        <div class="body">
            <div class="body-logo"></div>
            <center><button class="button-variant" onclick="landing()">Back</button></center>
            <form class="login" action="/login" method="post">
                <input type="text" name="username" id="username" placeholder="Login">
                <input type="password" name="password" id="password" placeholder="Password">
                <button type="submit" class="button">Login</button>
                {% if invalid %}
                <p style="color: var(--error);">Invalid username or password!</p>
                {% endif %}
            </form>
        </div>
    </div>
    <div class="footer">
        <a href="https://ps.01e.cc/web-phonebook" target="_blank">
            <p>Powered by web-phonebook</p>
        </a>
        <a href="https://ps.01e.cc" target="_blank" rel="noopener noreferrer">
            <div class="footer-img"></div>
        </a>
    </div>
</body>

</html>
