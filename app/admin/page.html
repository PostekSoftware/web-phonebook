<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonebook Admin - {{ phonebook.name }}</title>
    <script src="/static/jsoneditor.min.js"></script>
    <link rel="icon" href="/static/icon.png">
    <link rel="stylesheet" href="/static/web-phonebook.css">
    <script src="/static/common.js" defer></script>
    <style>
        body {
            color: var(--on-background);
        }
    </style>
</head>

<body>
    <div class="admin-header">
        <div class="admin-header-width">
            <p>Hello {{ username }}</p>
            <button class="button" onclick="landing()">Home</button>
            <button class="button-variant" onclick="logout()">Logout</button>
        </div>
    </div>
    <div class="main">
        <div class="body">
            <div class="body-logo"></div>
            <button style="margin: 5px !important;" onclick="save()" class="button">Save phonebook</button>
            <form id="sendForm" action="/admin" method="post" style="display: none;">
                <input width="6rem" id="valueForm" type="text" name="update" value="">
            </form>
            <div style="margin: 5px;" id='editor_holder'></div>
            <button style="margin: 5px !important;" onclick="saveLang()" class="button">Save language file</button>
            <form id="sendFormLang" action="/admin" method="post" style="display: none;">
                <input width="6rem" id="valueFormLang" type="text" name="lang" value="">
            </form>
            <div style="margin: 5px;" id='editor_holder_lang'></div>
        </div>
    </div>

    <script>
        var phonebook = {{ phonebook }}
        var lang = {{ lang }}
        console.log(phonebook)
        console.log(lang)

        const sendForm = document.getElementById('sendForm')
        const sendFormLang = document.getElementById('sendFormLang')
        const valueForm = document.getElementById('valueForm')
        const valueFormLang = document.getElementById('valueFormLang')
        const ed = document.getElementById('editor_holder');
        const edl = document.getElementById('editor_holder_lang');

        var editor = new JSONEditor(ed, {
            startval: phonebook,
            theme: "html",
            schema: {
                type: "object",
                title: "Phonebook",
                properties: {
                    name: {
                        type: "string",
                        title: "Organization name"
                    },
                    books: {
                        type: "array",
                        title: "Books",
                        items: {
                            type: "object",
                            properties: {
                                name: {
                                    type: "string",
                                    title: "Book name"
                                },
                                numbers: {
                                    type: "array",
                                    title: "Numbers",
                                    items: {
                                        type: "object",
                                        properties: {
                                            location: {
                                                type: "string",
                                                title: "Location"
                                            },
                                            title: {
                                                type: "string",
                                                title: "Title"
                                            },
                                            name: {
                                                type: "string",
                                                title: "Name"
                                            },
                                            email: {
                                                type: "string",
                                                title: "Email"
                                            },
                                            phoneInt: {
                                                type: "string",
                                                title: "Phone number (Internal)"
                                            },
                                            phoneExt: {
                                                type: "string",
                                                title: "Phone number (External)"
                                            }
                                        }
                                    }
                                },
                                groups: {
                                    type: "array",
                                    title: "Groups",
                                    items: {
                                        type: "object",
                                        properties: {
                                            name: {
                                                type: "string",
                                                title: "Group name"
                                            },
                                            numbers: {
                                                type: "array",
                                                title: "Numbers",
                                                items: {
                                                    type: "object",
                                                    properties: {
                                                        location: {
                                                            type: "string",
                                                            title: "Location"
                                                        },
                                                        title: {
                                                            type: "string",
                                                            title: "Title"
                                                        },
                                                        name: {
                                                            type: "string",
                                                            title: "Name"
                                                        },
                                                        email: {
                                                            type: "string",
                                                            title: "Email"
                                                        },
                                                        phoneInt: {
                                                            type: "string",
                                                            title: "Phone number (Internal)"
                                                        },
                                                        phoneExt: {
                                                            type: "string",
                                                            title: "Phone number (External)"
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        });

        var editorl = new JSONEditor(edl, {
            startval: lang,
            theme: "html",
            schema: {
                type: "object",
                title: "Language config",
                properties: {
                    search: {
                        type: "string",
                        title: "'Search...'"
                    },
                    room: {
                        type: "string",
                        title: "'Room'"
                    },
                    name: {
                        type: "string",
                        title: "'Name'"
                    },
                    phone: {
                        type: "string",
                        title: "'Phone'"
                    },
                }
            }
        })

        function save() {
            phonebook = editor.getValue();
            valueForm.value = JSON.stringify(phonebook)
            sendForm.submit()
        }
        function saveLang() {
            lang = editorl.getValue();
            valueFormLang.value = JSON.stringify(lang)
            sendFormLang.submit()
        }
    </script>
</body>

</html>
